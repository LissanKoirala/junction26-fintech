name: Vara
options:
  bundleIdPrefix: fi.vara.junction
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Vara:
    type: application
    platform: iOS
    sources:
      - path: Vara
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fi.vara.junction.ios
        INFOPLIST_FILE: Vara/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 76VMG5HC38
  VaraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes: ['*.cjs']
    dependencies:
      - target: Vara
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  VaraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Vara
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Vara:
    build:
      targets:
        Vara: all
    test:
      gatherCoverageData: true
      targets:
        - VaraTests
        - VaraUITests
